name: Build and Deploy Lembah Asri Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-lembah-asri
  cancel-in-progress: true

jobs:
  build:
    name: Build Godot Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Godot 4.3 with Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Regression check preserved legacy Stage 1 RUN8+IDLE
        run: |
          set -o pipefail
          timeout 45s godot --headless --audio-driver Dummy --path . --script res://tests/main_run8_integration_smoke.gd 2>&1 | tee main-run8-integration.log
          if grep -E 'SCRIPT ERROR|ERROR:|MAIN RUN8 FAIL' main-run8-integration.log; then
            echo "Illustrated main scene avatar integration failed"; exit 1
          fi
          grep -q 'MAIN RUN8 INTEGRATION PASS' main-run8-integration.log

      - name: Check layered PSD main Camera3D and physics
        run: |
          set -o pipefail
          timeout 70s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/psd_camera3d_smoke.gd 2>&1 | tee psd-camera3d-deploy.log
          if grep -E 'SCRIPT ERROR|ERROR:|PSD CAMERA3D FAIL' psd-camera3d-deploy.log; then
            echo "PSD main scene validation failed"; exit 1
          fi
          grep -q 'PSD CAMERA3D PASS:' psd-camera3d-deploy.log

      - name: Check exact polygon collision against house, fence, bridge and water
        run: |
          set -o pipefail
          timeout 70s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/psd_walkable_collision_smoke.gd 2>&1 | tee psd-walkable-web.log
          if grep -E 'SCRIPT ERROR|ERROR:|PSD WALK COLLISION FAIL' psd-walkable-web.log; then
            echo "Playable map collision audit failed"; exit 1
          fi
          grep -q 'PSD WALK COLLISION PASS:' psd-walkable-web.log

      - name: Verify PSD character Y-depth and bridge scale before Web export
        run: |
          set -o pipefail
          timeout 70s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/psd_depth_scaling_smoke.gd 2>&1 | tee psd-depth-web.log
          if grep -E 'SCRIPT ERROR|ERROR:|PSD DEPTH FAIL' psd-depth-web.log; then
            echo "PSD character bridge perspective scale failed"; exit 1
          fi
          grep -q 'PSD DEPTH PASS:' psd-depth-web.log

      - name: Check 2.5D lighting presets and real GPU frame differences
        run: |
          set -o pipefail
          timeout 75s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/psd_lighting_render_smoke.gd 2>&1 | tee psd-lighting-web.log
          if grep -E 'SCRIPT ERROR|ERROR:|PSD LIGHTING FAIL' psd-lighting-web.log; then
            echo "Lighting breakage in web-export candidate"; exit 1
          fi
          grep -q 'PSD LIGHTING PASS:' psd-lighting-web.log

      - name: Verify weather effects before Web export
        run: |
          set -o pipefail
          timeout 60s godot --headless --audio-driver Dummy --path . --script res://tests/rain_weather_smoke.gd 2>&1 | tee rain-weather-web-smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:|RAIN WEATHER FAIL' rain-weather-web-smoke.log; then
            echo "Rain/weather integration failed"; exit 1
          fi
          grep -q 'RAIN WEATHER PASS:' rain-weather-web-smoke.log

      - name: Export single-threaded Web build
        run: |
          mkdir -p build/web
          echo "Godot templates available:"
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type f \( -iname '*web*' -o -name version.txt \) | head -35 || true
          godot --headless --verbose --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          # Run the exported 3D pack with a graphical Compatibility renderer, not the dummy headless mesh server.
          mkdir -p /tmp/lembah-export-check
          cd /tmp/lembah-export-check
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --rendering-method gl_compatibility --main-pack "$GITHUB_WORKSPACE/build/web/index.pck" --quit-after 4 2>&1 | tee "$GITHUB_WORKSPACE/build/web-export-check.log"
          if grep -E 'SCRIPT ERROR|ERROR:|LEMBAH ASRI: approved concept texture is missing' "$GITHUB_WORKSPACE/build/web-export-check.log"; then
            echo "Exported pack reported a runtime problem"
            exit 1
          fi
          # PSD Camera3D playable main scene announces its source-layer startup marker.
          # 'ART LOADED:' belonged to the retired stage and produced a false
          # deployment failure despite successful export and runtime startup.
          grep -q 'LEMBAH ASRI MAIN PSD READY: four original layers, orthographic Camera3D, collision and RUN8/IDLE8' "$GITHUB_WORKSPACE/build/web-export-check.log"
          # Verify that the actual main pack initializes the approved RUN8/IDLE8 3D sprite.
          # The approved proportional RUN8 asset remains the authoritative game character.
          grep -q 'PSD 3D CHARACTER READY: RUN8+IDLE8' "$GITHUB_WORKSPACE/build/web-export-check.log"
          grep -q 'PSD COLLISION MAP READY: polygonal yard, narrow walkable bridge, far shore' "$GITHUB_WORKSPACE/build/web-export-check.log"
          cd "$GITHUB_WORKSPACE"
          touch build/web/.nojekyll
          echo "Web export files:"
          ls -lh build/web/

      - name: Smoke test approved proportional eight-direction preview
        run: |
          set -o pipefail
          godot --headless --audio-driver Dummy --path . --script res://tests/run8_proportional_browser_smoke.gd 2>&1 | tee run8-proportional-browser-smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:|PROPORTIONAL RUN8 FAIL' run8-proportional-browser-smoke.log; then
            echo "Approved 74-pose RUN8 preview is broken"; exit 1
          fi
          grep -q 'PROPORTIONAL RUN8 PASS:' run8-proportional-browser-smoke.log

      - name: Regression test legacy 16-pose walk preview (not the published RUN8 test)
        run: |
          set -o pipefail
          godot --headless --audio-driver Dummy --path . --script res://tests/run8_directions_smoke.gd 2>&1 | tee legacy-run8-smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:|RUN8 FAIL' legacy-run8-smoke.log; then
            echo "Legacy walking test failed"; exit 1
          fi
          grep -q 'RUN8 PASS:' legacy-run8-smoke.log

      - name: Verify uploaded run animation actually loads
        run: |
          set -o pipefail
          godot --headless --audio-driver Dummy --path . --script res://tests/run8_uploaded_smoke.gd 2>&1 | tee uploaded-run8-smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:|UPLOADED RUN8 FAIL' uploaded-run8-smoke.log; then
            echo "Uploaded run8 scene has runtime errors"
            exit 1
          fi
          grep -q 'UPLOADED RUN8 PASS' uploaded-run8-smoke.log

      - name: Export approved RUN8 proportional preview (game main remains unchanged)
        run: |
          set -euo pipefail
          cp project.godot /tmp/lembah-main-project.godot
          trap 'cp /tmp/lembah-main-project.godot project.godot' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path("project.godot")
          text = path.read_text(encoding="utf-8")
          src = 'run/main_scene="res://scenes/rumah_ladang_psd_camera3d.tscn"'
          dst = 'run/main_scene="res://scenes/run8_proportional_test.tscn"'
          assert src in text, "Main scene has changed; do not replace it silently"
          path.write_text(text.replace(src, dst), encoding="utf-8")
          PY
          mkdir -p build/web/run8
          godot --headless --path . --editor --quit
          godot --headless --path . --export-release "Web" build/web/run8/index.html
          test -s build/web/run8/index.html
          test -s build/web/run8/index.wasm
          test -s build/web/run8/index.pck
          # Verify the actual deployed /run8/ .pck starts the proportional
          # scene. Previously /run8/ served a 16-frame WALK test despite PASS.
          mkdir -p /tmp/lembah-proportional-preview-check
          (
            cd /tmp/lembah-proportional-preview-check
            godot --headless --audio-driver Dummy --main-pack "$GITHUB_WORKSPACE/build/web/run8/index.pck" --quit-after 4 2>&1 | tee "$GITHUB_WORKSPACE/build/proportional-run8-export-check.log"
          )
          if grep -E 'SCRIPT ERROR|ERROR:|PROPORTIONAL RUN8 FAIL' build/proportional-run8-export-check.log; then
            echo "Exported proportional RUN8 pack has runtime errors"; exit 1
          fi
          grep -q 'PROPORTIONAL RUN8 PREVIEW ACTIVE: 74 poses' build/proportional-run8-export-check.log
          echo "PROPORTIONAL RUN8 EXPORT PASS: 74 frames; no legacy WALK source"
          # Also export the actual uploaded run sprites without replacing the legacy comparison.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project.godot")
          s = p.read_text(encoding="utf-8")
          old = 'run/main_scene="res://scenes/run8_proportional_test.tscn"'
          new = 'run/main_scene="res://scenes/run8_uploaded.tscn"'
          assert old in s
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY
          mkdir -p build/web/run8-uploaded
          godot --headless --path . --editor --quit
          godot --headless --path . --export-release "Web" build/web/run8-uploaded/index.html
          test -s build/web/run8-uploaded/index.html
          test -s build/web/run8-uploaded/index.wasm
          test -s build/web/run8-uploaded/index.pck
          echo "RUN8 UPLOADED EXPORT PASS"

      - name: Export separate Rumah-Ladang RUN8 test without replacing old scenes
        run: |
          set -euo pipefail
          cp project.godot /tmp/lembah-rumah-ladang-original-project.godot
          trap 'cp /tmp/lembah-rumah-ladang-original-project.godot project.godot' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project.godot")
          s = p.read_text(encoding="utf-8")
          old = 'run/main_scene="res://scenes/rumah_ladang_psd_camera3d.tscn"'
          new = 'run/main_scene="res://scenes/rumah_ladang_run8_test.tscn"'
          assert old in s, "Old main scene must remain unchanged"
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY
          mkdir -p build/web/rumah-ladang-test
          godot --headless --path . --editor --quit
          godot --headless --path . --export-release "Web" build/web/rumah-ladang-test/index.html
          test -s build/web/rumah-ladang-test/index.html
          test -s build/web/rumah-ladang-test/index.wasm
          test -s build/web/rumah-ladang-test/index.pck
          mkdir -p /tmp/lembah-rumah-ladang-export-check
          (
            cd /tmp/lembah-rumah-ladang-export-check
            godot --headless --audio-driver Dummy --main-pack "$GITHUB_WORKSPACE/build/web/rumah-ladang-test/index.pck" --quit-after 4 2>&1 | tee "$GITHUB_WORKSPACE/build/rumah-ladang-export-check.log"
          )
          if grep -E 'SCRIPT ERROR|ERROR:|RUMAH LADANG RUN8 FAIL' build/rumah-ladang-export-check.log; then
            echo "New Rumah-Ladang test web pack has a runtime problem"; exit 1
          fi
          grep -q 'RUMAH LADANG RUN8 TEST ACTIVE: 74 normalized poses' build/rumah-ladang-export-check.log
          grep -q 'RUMAH LADANG IDLE8 NEW READY: eight individually generated normalized standing poses' build/rumah-ladang-export-check.log
          grep -q 'RUMAH LADANG IDLE8 NEW SCENE READY: all eight NEW poses normalized to RUN8' build/rumah-ladang-export-check.log
          test -s assets/characters/idle8_new/Idle8_Normalized.png
          echo '5fa6c2ca4f4f23c8f13e2a611626fc35a212cb4c7d52d745bdcf2eff798b0445  assets/characters/idle8_new/Idle8_Normalized.png' | sha256sum --check -
          grep -q 'RUMAH LADANG CAMERA SYNC PASS: runner and Camera2D render-idle updates' build/rumah-ladang-export-check.log
          test -s assets/art/scenes/rumah_ladang_empty.png
          echo '7cfb92976182aa9c257954787fb7ab3f7c9cbf6298f8252944f5dc549e87d4c5  assets/art/scenes/rumah_ladang_empty.png' | sha256sum --check -
          grep -q 'background=original' build/rumah-ladang-export-check.log
          echo "RUMAH LADANG WEB EXPORT PASS: original lossless 1672x941 PNG and 74-frame RUN8 fully active"
      - name: Validate native weather soil/river/storm before Web export
        run: |
          set -o pipefail
          timeout 80s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/psd_native_weather_smoke.gd 2>&1 | tee native-weather-export.log
          if grep -E 'SCRIPT ERROR|ERROR:|PSD NATIVE WEATHER FAIL' native-weather-export.log; then exit 1; fi
          grep -q 'PSD NATIVE WEATHER PASS:' native-weather-export.log
          timeout 80s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/psd_native_weather_render.gd 2>&1 | tee native-weather-gpu-export.log
          if grep -E 'SCRIPT ERROR|ERROR:|PSD NATIVE WEATHER RENDER FAIL' native-weather-gpu-export.log; then exit 1; fi
          grep -q 'PSD NATIVE WEATHER RENDER PASS:' native-weather-gpu-export.log

      - name: Export isolated native Camera2D PSD playable preview
        run: |
          set -euo pipefail
          cp project.godot /tmp/lembah-main-before-camera2d.godot
          trap 'cp /tmp/lembah-main-before-camera2d.godot project.godot' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project.godot")
          text = p.read_text()
          old = 'run/main_scene="res://scenes/rumah_ladang_psd_camera3d.tscn"'
          new = 'run/main_scene="res://scenes/rumah_ladang_psd_camera2d.tscn"'
          assert old in text, "Production Camera3D main was unexpectedly replaced"
          p.write_text(text.replace(old, new))
          PY
          mkdir -p build/web/camera2d
          godot --headless --path . --editor --quit
          godot --headless --path . --export-release "Web" build/web/camera2d/index.html
          test -s build/web/camera2d/index.html
          test -s build/web/camera2d/index.wasm
          test -s build/web/camera2d/index.pck
          mkdir -p /tmp/lembah-camera2d-preview-check
          (
            cd /tmp/lembah-camera2d-preview-check
            xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --rendering-method gl_compatibility --main-pack "$GITHUB_WORKSPACE/build/web/camera2d/index.pck" --quit-after 4 2>&1 | tee "$GITHUB_WORKSPACE/build/psd-camera2d-export-check.log"
          )
          if grep -E 'SCRIPT ERROR|ERROR:|PSD CAMERA2D:' build/psd-camera2d-export-check.log; then exit 1; fi
          grep -q 'LEMBAH ASRI PSD CAMERA2D PREVIEW READY:' build/psd-camera2d-export-check.log
          echo "CAMERA2D PREVIEW EXPORT PASS: alternate scene, production main unchanged"

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: lembah-asri-web
          path: build/web
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages package
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Godot game
        id: deployment
        uses: actions/deploy-pages@v4
