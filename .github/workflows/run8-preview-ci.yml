name: Run8 Preview Godot QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/run8-godot-test-oct12]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run8-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Verify 8 animation directions and test scene
        run: |
          set -o pipefail
          godot --headless --audio-driver Dummy --path . --script res://tests/run8_directions_smoke.gd 2>&1 | tee run8.log
          if grep -E 'SCRIPT ERROR|ERROR:|RUN8 FAIL' run8.log; then
            exit 1
          fi
          grep -q 'RUN8 PASS:' run8.log
