name: Install Uploaded 8-Direction Character

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-uploaded-character.yml"
      - "tools/install_uploaded_character.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-poses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full assets
        uses: actions/checkout@v4
      - name: Install lossless PNG dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Identify and pad eight approved, user-uploaded images
        run: python tools/install_uploaded_character.py
      - name: Commit normalized game-ready PNGs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/characters/player_base_8dir/
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Activate eight native HD protagonist base poses in Godot"
          git push origin HEAD:main
