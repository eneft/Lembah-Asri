name: Lembah Asri Village 3D Preview Check

on:
  pull_request:
    paths:
      - 'scripts/village3d_preview.gd'
      - 'scenes/village3d_preview.tscn'
      - 'tests/village3d_preview_smoke.gd'
      - '.github/workflows/village3d-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Test isolated village preview
        run: |
          set -o pipefail
          timeout 60s godot --headless --audio-driver Dummy --path . --script res://tests/village3d_preview_smoke.gd 2>&1 | tee village3d-preview.log
          if grep -E 'SCRIPT ERROR|ERROR:|VILLAGE3D FAIL' village3d-preview.log; then exit 1; fi
          grep -q 'VILLAGE3D PREVIEW PASS' village3d-preview.log
