name: V24 Transfer Godot Binary For V23 Local Test
on:
  push:
    branches: ['qa/v21-visual-render-test-20261021']
permissions:
  contents: read
jobs:
  export-linux-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup tested Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Export engine to artifact
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          mkdir -p engine_bin
          cp "$(readlink -f "$(command -v godot)")" engine_bin/godot43-linux
          chmod +x engine_bin/godot43-linux
          sha256sum engine_bin/godot43-linux > engine_bin/SHA256SUMS
          du -h engine_bin/godot43-linux
      - name: Upload engine binary for actual local terrain render QA
        uses: actions/upload-artifact@v4
        with:
          name: v24-godot43-linux-engine
          path: engine_bin/
          compression-level: 9
          retention-days: 2
