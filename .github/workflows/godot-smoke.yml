name: Godot 4 Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Report Godot version
        run: godot --version
      - name: Import project headlessly
        run: godot --headless --path . --editor --quit
      - name: Main stage eight-direction integration and scale
        run: |
          set -o pipefail
          timeout 180s godot --headless --audio-driver Dummy --path . --script res://tests/main_run8_integration_smoke.gd 2>&1 | tee main-run8-integration.log
          if grep -E 'SCRIPT ERROR|ERROR:|MAIN RUN8 FAIL' main-run8-integration.log; then
            echo "Main scene character integration failed"; exit 1
          fi
          grep -q 'MAIN RUN8 INTEGRATION PASS' main-run8-integration.log
      - name: Gameplay smoke with existing art and controls
        run: |
          set -o pipefail
          # Gameplay checks are headless; the following two dedicated smoke
          # jobs use xvfb-rendering for actual sprite and river GPU validation.
          timeout 180s godot --headless --audio-driver Dummy --path . --script res://tests/smoke_test.gd 2>&1 | tee godot-smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:|RUN FAIL|SMOKE FAIL|LAYER FAIL|HUD FAIL|WATER FAIL|BRIDGE FAIL' godot-smoke.log; then
            echo "Godot gameplay smoke reported a regression"; exit 1
          fi
          grep -q 'SMOKE PASS:' godot-smoke.log
      - name: Render and verify imported real run frames
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/run_cycle_render_smoke.gd 2>&1 | tee godot-gait-render.log
          if grep -E 'SCRIPT ERROR|ERROR:|RUN FRAME FAIL' godot-gait-render.log; then
            echo "Run frame validation failed"; exit 1
          fi
          grep -q 'RUN FRAME PASS:' godot-gait-render.log
      - name: Verify rendered water changes over time without moving shorelines
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/water_motion_render_smoke.gd 2>&1 | tee godot-water-render.log
          if grep -E 'SCRIPT ERROR|ERROR:|WATER RENDER FAIL' godot-water-render.log; then
            echo "Water animation render validation failed"; exit 1
          fi
          grep -q 'WATER RENDER PASS:' godot-water-render.log
