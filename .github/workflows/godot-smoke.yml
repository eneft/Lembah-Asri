name: Godot 4 Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Report Godot version
        run: godot --version
      - name: Import project headlessly
        run: godot --headless --path . --editor --quit
      - name: Gameplay smoke with graphics renderer
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/smoke_test.gd 2>&1 | tee godot-smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:|SMOKE FAIL' godot-smoke.log; then
            echo "Godot emitted a runtime error"; exit 1
          fi
          grep -q 'SMOKE PASS:' godot-smoke.log
      - name: Render and verify imported real run frames
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/run_cycle_render_smoke.gd 2>&1 | tee godot-gait-render.log
          if grep -E 'SCRIPT ERROR|ERROR:|RUN FRAME FAIL' godot-gait-render.log; then
            echo "Run frame validation failed"; exit 1
          fi
          grep -q 'RUN FRAME PASS:' godot-gait-render.log
