name: Godot 4 Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Report Godot version
        run: godot --version
      - name: Import project headlessly
        run: godot --headless --path . --editor --quit
      - name: Main stage eight-direction integration and scale
        run: |
          set -o pipefail
          timeout 45s godot --headless --audio-driver Dummy --path . --script res://tests/main_run8_integration_smoke.gd 2>&1 | tee main-run8-integration.log
          if grep -E 'SCRIPT ERROR|ERROR:|MAIN RUN8 FAIL' main-run8-integration.log; then
            echo "Main scene character integration failed"; exit 1
          fi
          grep -q 'MAIN RUN8 INTEGRATION PASS' main-run8-integration.log
      - name: Verify published RUN8 browser preview uses proportional 74-frame character
        run: |
          set -o pipefail
          timeout 45s godot --headless --audio-driver Dummy --path . --script res://tests/run8_proportional_browser_smoke.gd 2>&1 | tee browser-proportional-smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:|PROPORTIONAL RUN8 FAIL' browser-proportional-smoke.log; then
            echo "Published run8 preview still points to wrong character"; exit 1
          fi
          grep -q 'PROPORTIONAL RUN8 PASS:' browser-proportional-smoke.log
      - name: Test separate Rumah-Ladang environment with latest proportional RUN8
        run: |
          set -o pipefail
          timeout 60s godot --headless --audio-driver Dummy --path . --script res://tests/rumah_ladang_run8_smoke.gd 2>&1 | tee rumah-ladang-run8-test.log
          if grep -E 'SCRIPT ERROR|ERROR:|RUMAH LADANG RUN8 FAIL' rumah-ladang-run8-test.log; then
            echo "Rumah-Ladang RUN8 test failed"; exit 1
          fi
          grep -q 'RUMAH LADANG RUN8 SMOKE PASS:' rumah-ladang-run8-test.log
          # Original PNG is a separate binary asset; report its absence
          # explicitly rather than claiming the approved scene is installed.
          if grep -q 'RUMAH LADANG BACKGROUND PENDING' rumah-ladang-run8-test.log; then
            echo "::notice::Approved character-free Rumah-Ladang PNG is still missing from Git; fallback visible in test only."
          fi
      - name: Verify 3D camera PSD scene, 4 editable planes, and RUN8 IDLE8 layering
        run: |
          set -o pipefail
          timeout 60s godot --headless --audio-driver Dummy --path . --script res://tests/psd_camera3d_smoke.gd 2>&1 | tee psd-camera3d.log
          if grep -E 'SCRIPT ERROR|ERROR:|PSD CAMERA3D FAIL' psd-camera3d.log; then
            echo "PSD Camera3D scene validation failed"; exit 1
          fi
          grep -q 'PSD CAMERA3D PASS:' psd-camera3d.log
      - name: Rain, soil splash crowns, and river RGBA ripples
        run: |
          set -o pipefail
          timeout 60s godot --headless --audio-driver Dummy --path . --script res://tests/rain_weather_smoke.gd 2>&1 | tee rain-weather.log
          if grep -E 'SCRIPT ERROR|ERROR:|RAIN WEATHER FAIL' rain-weather.log; then
            echo "Rain weather smoke failed"; exit 1
          fi
          grep -q 'RAIN WEATHER PASS:' rain-weather.log
      - name: Verify batched rain is visibly rendered (Compatibility renderer)
        run: |
          set -o pipefail
          timeout 60s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/rain_render_smoke.gd 2>&1 | tee rain-render.log
          if grep -E 'SCRIPT ERROR|ERROR:|RAIN RENDER FAIL' rain-render.log; then
            echo "Batched rain GPU output failed"; exit 1
          fi
          grep -q 'RAIN RENDER PASS:' rain-render.log
      - name: Verify ground splash, puddle glint and player footprint GPU pixels
        run: |
          set -o pipefail
          timeout 65s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/puddle_render_smoke.gd 2>&1 | tee puddle-render.log
          if grep -E 'SCRIPT ERROR|ERROR:|PUDDLE RENDER FAIL' puddle-render.log; then
            echo "Ground puddle/footstep rendering failed"; exit 1
          fi
          grep -q 'PUDDLE RENDER PASS:' puddle-render.log
      - name: Gameplay smoke with existing art and controls
        run: |
          set -o pipefail
          # Gameplay checks are headless; the following two dedicated smoke
          # jobs use xvfb-rendering for actual sprite and river GPU validation.
          timeout 180s godot --headless --audio-driver Dummy --path . --script res://tests/smoke_test.gd 2>&1 | tee godot-smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:|RUN FAIL|SMOKE FAIL|LAYER FAIL|HUD FAIL|WATER FAIL|BRIDGE FAIL' godot-smoke.log; then
            echo "Godot gameplay smoke reported a regression"; exit 1
          fi
          grep -q 'SMOKE PASS:' godot-smoke.log
      - name: Render and verify imported real run frames
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/run_cycle_render_smoke.gd 2>&1 | tee godot-gait-render.log
          if grep -E 'SCRIPT ERROR|ERROR:|RUN FRAME FAIL' godot-gait-render.log; then
            echo "Run frame validation failed"; exit 1
          fi
          grep -q 'RUN FRAME PASS:' godot-gait-render.log
      - name: Verify rendered water changes over time without moving shorelines
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/water_motion_render_smoke.gd 2>&1 | tee godot-water-render.log
          if grep -E 'SCRIPT ERROR|ERROR:|WATER RENDER FAIL' godot-water-render.log; then
            echo "Water animation render validation failed"; exit 1
          fi
          grep -q 'WATER RENDER PASS:' godot-water-render.log
