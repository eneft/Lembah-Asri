name: Clean Meshy Village Head Roof (isolated asset branch)

on:
  push:
    branches:
      - asset/rumah-kepala-desa-meshy-source
    paths:
      - .github/workflows/clean-village-head-roof.yml
      - blockout3d/tools/clean_village_head_roof.py
      - blockout3d/assets/environment/houses/village_head/Meshy_AI_Rumah_Merah_Putih_1104091308_texture.glb
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-original-glb:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current asset branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python for mesh and UV validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic mesh-clean dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy Pillow
      - name: Remove roof foliage without touching original source PNGs or normals
        shell: bash
        run: |
          set -euo pipefail
          python blockout3d/tools/clean_village_head_roof.py \
            blockout3d/assets/environment/houses/village_head/Meshy_AI_Rumah_Merah_Putih_1104091308_texture.glb \
            blockout3d/assets/environment/houses/village_head/rumah_kepala_desa_clean.glb | tee roof-clean-report.log
          grep -q 'ROOF WALL V12 PASS:' roof-clean-report.log
          grep -q 'PRESERVE PASS:' roof-clean-report.log
          grep -q 'REPAINT V12 PASS:' roof-clean-report.log
          test -s blockout3d/assets/environment/houses/village_head/rumah_kepala_desa_clean.glb
      - name: Commit new clean asset on branch only, preserve original file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blockout3d/assets/environment/houses/village_head/rumah_kepala_desa_clean.glb
          if git diff --cached --quiet; then
            echo "Clean asset unchanged: already committed"
          else
            git commit -m "fix(assets): remove kepala-desa roof plants and wall vines without roof holes"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Verify source and cleaned GLBs coexist
        run: |
          test -s blockout3d/assets/environment/houses/village_head/Meshy_AI_Rumah_Merah_Putih_1104091308_texture.glb
          test -s blockout3d/assets/environment/houses/village_head/rumah_kepala_desa_clean.glb
          sha256sum blockout3d/assets/environment/houses/village_head/*.glb
