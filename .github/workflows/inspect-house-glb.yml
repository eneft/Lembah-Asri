name: Inspect house ground GLB (diagnostics)
on:
  push:
    paths:
      - ".github/workflows/inspect-house-glb.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Analyze GLB mesh and material bounding boxes
        id: metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'web/public/models/environment/rumah_utama.glb';
          const bytes = fs.readFileSync(path);
          const size = bytes.readUInt32LE(12);
          const gltf = JSON.parse(bytes.subarray(20,20+size).toString('utf8'));
          const entries = [];
          const nodes = gltf.nodes || [];
          for(let n=0;n<nodes.length;n++){
            const node=nodes[n], m=gltf.meshes?.[node.mesh];
            if(!m)continue;
            for(const [pidx, p] of (m.primitives||[]).entries()){
              const a=gltf.accessors[p.attributes.POSITION];
              if(!a?.min || !a?.max)continue;
              const d=a.max.map((v,i)=>v-a.min[i]);
              const area=d[0]*d[2];
              const mat=gltf.materials?.[p.material];
              entries.push({name:(node.name||m.name||'n'+n).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,22),mat:(mat?.name||'none').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,18),d:d.map(x=>Math.round(x*100)/100),low:Math.round(a.min[1]*100)/100,area,idx:n});
            }
          }
          const overall=entries.map(e=>e.d);
          const ranked=entries.sort((a,b)=>b.area-a.area).slice(0,10).map(e=>`${e.name}-${e.mat}-${e.d.join('x')}-y${e.low}`);
          const infos=[`mesh-count${gltf.meshes?.length}-node-count${nodes.length}-mat-count${gltf.materials?.length}`,...ranked];
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'matrix='+JSON.stringify({info:infos})+'\n');
          console.log(JSON.stringify({infos,entries},null,2));
          NODE
  names:
    needs: inspect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inspect.outputs.matrix) }}
    name: ${{ matrix.info }}
    steps:
      - run: echo "House surface inventory"
