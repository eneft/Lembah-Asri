name: Import user-supplied PBR house GLB (temporary)
on:
  push:
    branches: [feature/import-user-house-pbr]
permissions:
  contents: write
jobs:
  import_house:
    name: Ingest verified PBR house into repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow (one-time texture optimization)
        run: python -m pip install 'Pillow==11.3.0'
      - name: Download source GLB with checksum verification
        env:
          ORIGINAL_GLB_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3KuXgabELoP13yL56g9yyaMqNeN/060eb255-3501-4c85-81aa-cac59de61e0d.glb
        shell: bash
        run: |
          set -euo pipefail
          if test -f web/public/models/environment/rumah_utama_user_pbr.glb; then
            echo 'Model already imported'; exit 0
          fi
          curl --fail --silent --show-error --location --retry 3 --max-time 240 "$ORIGINAL_GLB_URL" -o /tmp/base_basic_pbr.glb
          echo '6f8eb6de6f40b85cdeda83401c1ec0983f5e08c8ceb3e506a8e05579967f710b  /tmp/base_basic_pbr.glb' | sha256sum --check
          python web/scripts/optimize-house-glb.py /tmp/base_basic_pbr.glb web/public/models/environment/rumah_utama_user_pbr.glb
      - name: Commit imported self-contained GLB (no runtime dependency)
        shell: bash
        run: |
          set -euo pipefail
          if test -z "$(git status --porcelain -- web/public/models/environment/rumah_utama_user_pbr.glb)"; then
            echo 'No binary change needed'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/models/environment/rumah_utama_user_pbr.glb
          git commit -m 'Import original supplied PBR house optimized for mobile (unchanged geometry UV)'
          git push origin HEAD:feature/import-user-house-pbr
