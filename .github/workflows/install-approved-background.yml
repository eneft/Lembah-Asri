name: Install approved Lembah Asri background (lossless)
on:
  push:
    branches:
      - feat/replace-environment-base-20261011

permissions:
  contents: write

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct exact user-approved PNG
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, struct
          folder = pathlib.Path(".asset_transfer")
          paths = sorted(folder.glob("part_*.b64"))
          assert len(paths) == 11, f"expected 11 transfer parts, got {len(paths)}"
          assert [p.name for p in paths] == [f"part_{n:02}.b64" for n in range(11)]
          b64 = "".join("".join(p.read_text().split()) for p in paths)
          raw = base64.b64decode(b64, validate=True)
          sha = hashlib.sha256(raw).hexdigest()
          assert sha == "a7b72f2965fa2a5ceef53940814d485f84d6b24f9ecdb3cf2fe682a5cb3920c5", sha
          assert raw[:8] == b"\\x89PNG\\r\\n\\x1a\\n", "Not PNG"
          width, height = struct.unpack(">II", raw[16:24])
          assert (width, height) == (1672, 941), (width, height)
          path = pathlib.Path("assets/art/layers/background_base.png")
          path.write_bytes(raw)
          print(f"READY: {path} {len(raw)} bytes {width}x{height}, SHA256 {sha}")
          PY
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Import Godot assets
        run: godot --headless --path . --editor --quit
      - name: Run stage 1 regression smoke
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/smoke_test.gd 2>&1 | tee smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:|SMOKE FAIL|STAGE1 FAIL' smoke.log; then exit 1; fi
          grep -q 'SMOKE PASS:' smoke.log
      - name: Commit final image and remove one-time transfer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/layers/background_base.png
          git rm -r .asset_transfer
          git rm .github/workflows/install-approved-background.yml
          git commit -m "Install approved abandoned-house background base [skip ci]"
          git push origin HEAD:feat/replace-environment-base-20261011
