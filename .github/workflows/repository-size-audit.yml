name: Repository size audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  size-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit reachable Git objects and new assets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$BASE_SHA" ]]; then args+=(--base "$BASE_SHA"); fi
          python3 tools/audit_repo_size.py "${args[@]}" | tee "$GITHUB_STEP_SUMMARY"
