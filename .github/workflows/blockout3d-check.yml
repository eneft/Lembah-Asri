name: Standalone New 3D Blockout Smoke and Web Export

on:
  pull_request:
    paths:
      - 'blockout3d/**'
      - '.github/workflows/blockout3d-check.yml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-blockout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore original textured fisherman house (95k triangles, UV)
        run: python3 blockout3d/tools/restore_fisherman_uv_glb.py

      - name: Install Godot 4.3 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Validate V5 village road clearance and river source
        run: python3 blockout3d/tests/terrain_v5_layout_audit.py
      - name: Validate V7 settlement alignment with house pads and roads
        run: python3 blockout3d/tests/terrain_v7_layout_audit.py
      - name: Validate V7.3 vegetation protects plots, paths, bridges and village plaza
        run: python3 blockout3d/tests/terrain_v73_vegetation_layout.py
      - name: Build web-optimized uploaded terrain GLB
        run: |
          python3 -m pip install --user Pillow
          python3 blockout3d/tools/optimize_terrain_base.py
          test -s blockout3d/assets/environment/island/terrain_base_web.glb
          # Keep original source in Git; exclude 53MB 8K source from web builds.
          mv "blockout3d/assets/environment/island/terrain base.glb" /tmp/lembah-terrain-source-original.glb
      - name: Import the independent 3D project (NOT root 2D)
        run: godot --headless --path blockout3d --editor --quit
      - name: Validate standalone Balai Desa modular prototype, texture UV and openings
        run: |
          set -o pipefail
          timeout 90s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --rendering-method gl_compatibility --path blockout3d --script res://tests/modular_balai_smoke.gd 2>&1 | tee modular-balai.log
          if grep -E 'SCRIPT ERROR|ERROR:|BALAI MODULAR V0.1 FAIL' modular-balai.log; then exit 1; fi
          grep -q 'BALAI MODULAR V0.1 PASS:' modular-balai.log
      - name: Run the actual 3D scene smoke using Compatibility renderer
        run: |
          set -o pipefail
          timeout 75s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --rendering-method gl_compatibility --path blockout3d --script res://tests/smoke.gd 2>&1 | tee blockout3d-smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:|BLOCKOUT3D FAIL' blockout3d-smoke.log; then exit 1; fi
          grep -q 'BLOCKOUT3D PASS:' blockout3d-smoke.log
      - name: Check uploaded terrain Web scene A/B and collision
        run: |
          set -o pipefail
          timeout 110s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --rendering-method gl_compatibility --path blockout3d --script res://tests/terrain_base_smoke.gd 2>&1 | tee terrain-base-smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:|TERRAIN BASE FAIL' terrain-base-smoke.log; then exit 1; fi
          grep -q 'TERRAIN BASE SMOKE PASS:' terrain-base-smoke.log
      - name: Check V7 real buildings and player-wall collision
        run: |
          set -o pipefail
          timeout 125s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --rendering-method gl_compatibility --path blockout3d --script res://tests/terrain_v7_settlement_smoke.gd 2>&1 | tee terrain-v7.log
          if grep -E 'SCRIPT ERROR|ERROR:|V7 SETTLEMENT FAIL' terrain-v7.log; then exit 1; fi
          grep -q 'V7 SETTLEMENT SMOKE PASS:' terrain-v7.log
      - name: Verify V7.3 terrain-grounded vegetation, collision and instanced grass
        run: |
          set -o pipefail
          timeout 145s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --rendering-method gl_compatibility --path blockout3d --script res://tests/terrain_v73_vegetation_smoke.gd 2>&1 | tee terrain-v73-vegetation.log
          if grep -E 'SCRIPT ERROR|ERROR:|V7.3 VEGETATION FAIL' terrain-v73-vegetation.log; then exit 1; fi
          grep -q 'V7.3 VEGETATION SMOKE PASS:' terrain-v73-vegetation.log
      - name: Verify V7.9 five separate area scenes and distance-culling physics
        run: |
          timeout 135s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --rendering-method gl_compatibility --path blockout3d --script res://tests/terrain_v79_streaming_smoke.gd 2>&1 | tee terrain-v79-area-streaming.log
          if grep -E 'SCRIPT ERROR|ERROR:|AREA V7.9 FAIL' terrain-v79-area-streaming.log; then exit 1; fi
          grep -q 'AREA V7.9 SCENE STREAM PASS:' terrain-v79-area-streaming.log
      - name: Verify V8.0 actual area scene instantiation/unloading and debug menu
        run: |
          timeout 155s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --rendering-method gl_compatibility --path blockout3d --script res://tests/terrain_v80_scene_loading_smoke.gd 2>&1 | tee terrain-v80-stream.log
          if grep -E 'SCRIPT ERROR|ERROR:|AREA V8 FAIL' terrain-v80-stream.log; then exit 1; fi
          grep -q 'AREA V8 REAL STREAM PASS:' terrain-v80-stream.log
          grep -q 'AREA V8.1 SCENE PICKER AUDIT PASS:' terrain-v80-stream.log
      - name: Walk real player capsule across both bridges
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --rendering-method gl_compatibility --path blockout3d --script res://tests/terrain_v6_traversal_smoke.gd 2>&1 | tee terrain-v6-traversal.log
          if grep -E 'SCRIPT ERROR|ERROR:|TERRAIN V6 TRAVERSAL FAIL' terrain-v6-traversal.log; then exit 1; fi
          grep -q 'TERRAIN V6 TRAVERSAL PASS:' terrain-v6-traversal.log

      - name: Verify four Mixamo FBX animation states (or explicit pending status)
        run: |
          set -o pipefail
          timeout 80s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --rendering-method gl_compatibility --path blockout3d --script res://tests/fbx_character_smoke.gd 2>&1 | tee fbx-character.log
          if grep -E 'SCRIPT ERROR|ERROR:|FBX ANIMATION FAIL' fbx-character.log; then exit 1; fi
          grep -Eq 'FBX ANIMATION (PASS|PENDING):' fbx-character.log
      - name: Export playable standalone Web build
        run: |
          mkdir -p blockout3d/web-preview
          godot --headless --path blockout3d --export-release Web "$GITHUB_WORKSPACE/blockout3d/web-preview/index.html"
          test -s blockout3d/web-preview/index.html
          test -s blockout3d/web-preview/index.wasm
          test -s blockout3d/web-preview/index.pck
      - name: Save 3D Web preview artifact for PR review
        uses: actions/upload-artifact@v4
        with:
          name: lembah-asri-blockout3d-web
          path: blockout3d/web-preview
          retention-days: 7
