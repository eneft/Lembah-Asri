name: Three.js foundation CI

on:
  push:
    branches: [migration/threejs-foundation]
    paths: ['web/**', '.github/workflows/threejs-foundation.yml']
  pull_request:
    branches: [main]
    paths: ['web/**', '.github/workflows/threejs-foundation.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
